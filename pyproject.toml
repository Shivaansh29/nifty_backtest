[project]
name = "nifty-backtest"
version = "0.1.0"
description = "Backtests NIFTY index option strategies on NSE end-of-day data, with an API and dashboard."
readme = "README.md"
authors = [
    { name = "Shivaansh Aggarwal", email = "280832830+Shivaansh29@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

# `uv run nifty-backtest ...` calls main() in src/nifty_backtest/cli.py.
[project.scripts]
nifty-backtest = "nifty_backtest.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

# Tools needed to develop and check the code, but not to run it.
[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E, F) plus rule families that each catch a real class of problem.
select = [
    "E",    # pycodestyle errors: layout problems
    "W",    # pycodestyle warnings: whitespace problems
    "F",    # pyflakes: unused imports and variables, undefined names
    "I",    # isort: consistent import order
    "B",    # flake8-bugbear: likely bugs, e.g. mutable default arguments
    "UP",   # pyupgrade: use modern syntax for our Python version
    "SIM",  # flake8-simplify: needlessly complicated code
    "PT",   # flake8-pytest-style: consistent, idiomatic tests
    "RUF",  # ruff's own checks, e.g. ambiguous unicode characters
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
# -ra: summarise skipped and failed tests at the end of the run.
# importlib mode: tests import the installed package, never the folder they sit in.
addopts = ["-ra", "--import-mode=importlib"]
# Fail on unknown config keys, unregistered markers, and xfail tests that unexpectedly pass.
strict = true
