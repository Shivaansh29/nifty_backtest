# M9 study plan: machine-readable twin of m9_iron_condor_plan.md.
# FROZEN on 7 Nov 2026, approved by the owner, committed with the Markdown plan before any
# condor was run on real data. Both SHA-256 hashes and the commit go in every study.json.
# Changes only by a dated, logged amendment.

schema_version = 2

[study]
name = "m9-iron-condor"
frozen = true
seed = 20261106
bootstrap_resamples = 10000
bootstrap_intervals = ["iid", "circular_moving_block"]
block_length = 4                 # consecutive expiries
confidence = 0.95
verdict_interval = "conservative_envelope"
alpha = 0.05
holm_family = ["C1", "C2", "C3"]

[periods.development]
start = "2021-10-01"
end = "2024-09-30"

[periods.validation]             # previously observed: can reject, cannot confirm
start = "2024-10-01"
end = "2026-10-16"

[forward_holdout]                # M7's rule: one evaluation only
first_entry = "2026-10-17"
min_trades = 52                  # completed eligible B0 trades
latest_evaluation = "2028-01-31"

[baseline]                       # B0, the M6 reference configuration, unchanged
structure = "short_straddle"
entry_days_before_expiry = 3
lots = 1
brokerage_per_order_rs = 20.0
slippage_points_per_leg = 0.5
capital_rs = 500000.0
reference_run = "20261024-033815-short_straddle"

[rules]                          # plan section 2
expiry = "nearest_weekly"
entry_time = "close"
exit = "hold_to_expiry"
settlement = "intrinsic_from_official_settlement_level"
reference_premium = "atm_ce_close + atm_pe_close"
reference_legs_traded = false
short_call_target = "atm + short_multiple * reference_premium"
short_put_target = "atm - short_multiple * reference_premium"
long_call_target = "actual_short_call + wing_multiple * reference_premium"
long_put_target = "actual_short_put - wing_multiple * reference_premium"

[rounding]                       # plan section 2.1
listed_means = "row_exists_in_reference_chain_any_volume"
search = "by_option_type"
tie = "lower_strike"
distance_decimals = 6
move_to_traded_strike = false
wing_measured_from = "actual_short_strike"

[eligibility]                    # plan section 2.3, in check order
order = [
  "reference_atm_missing",
  "reference_atm_zero_volume",
  "degenerate_strikes",
  "leg_missing",
  "leg_zero_volume",
  "lot_size_unknown",
  "legs_have_different_quantities",
  "settlement_level_missing",
  "no_positive_credit",
  "no_defined_risk",
]
credit_basis = "close"           # so every slippage cell trades the same weeks
holding_period_liquidity = "log_only"
substitute_reference_price = false

[metrics]                        # plan sections 5 and 8
primary_return = "net_points / reference_premium_points"
secondary_return = "net_points / (max(wing_call, wing_put) - credit_fill)"
paired_difference = "d_pct on B0 filled premium; a skipped week counts as 0 points"
tail = "mean of the worst 5 percent of expiries, in B0 premium units"
drawdown_for_verdict = "rupee_max_drawdown_pct"
drawdown_lot_free = "cumulative_sum_notional_net"

# Plan section 6. Rates stay in reference/cost_rates.csv, by date.
[costs]
stt_exercise_basis = "intrinsic_value"
stt_exercise_payer = "purchaser"
sebi_notional_applies_to = ["exercised", "assigned"]
netting_across_legs = false
gst_on_ipft = true               # every M9 run; engine default false elsewhere; no overrides

# Each assumption is held separately so its status travels with its value.
[costs.assumptions.stamp_on_cash_exercise]
value_rs = 0.0
status = "modelling_assumption_unverified"
basis = "statutory_interpretation"
never_describe_as = "verified"

[costs.assumptions.brokerage_on_exercise]
value_rs = 0.0
status = "assumption"
basis = "no_order_is_placed"

[costs.assumptions.notional_definition]
value = "settlement_level_x_quantity"
status = "modelling_assumption_unverified"
basis = "no_fee_specific_definition_found"

[costs.assumptions.ipft_in_gst_base]
value = true
status = "modelling_assumption_unverified"
basis = "broker_practice_differs_no_primary_text"
never_describe_as = "statutory_requirement"

[costs.assumptions.exchange_and_ipft_on_exercise]
value_rs = 0.0
status = "absence_of_a_rule"
basis = "circulars_price_these_on_premium"

[[structures]]
id = "short_straddle"
strategy = "short_straddle"

[[structures]]
id = "condor_m100"
strategy = "iron_condor"
short_multiple = 1.00
wing_multiple = 1.00

[[structures]]
id = "condor_m075"
strategy = "iron_condor"
short_multiple = 0.75
wing_multiple = 1.00

[[structures]]
id = "condor_m125"
strategy = "iron_condor"
short_multiple = 1.25
wing_multiple = 1.00

# Roles as in M7. A primary may differ from B0 in `structure` only. Everything else needs `of`
# and exactly one change.

[[variants]]
id = "B0"
role = "baseline"

[[variants]]
id = "C1"
role = "primary"
structure = "condor_m100"

[[variants]]
id = "C2"
role = "primary"
structure = "condor_m075"

[[variants]]
id = "C3"
role = "primary"
structure = "condor_m125"

[[variants]]
id = "C1-R"
role = "realism"
of = "C1"
structure = "condor_m100"
strike_reference = "previous_close"

# Descriptive. Runs unconditionally for these targets, and for any primary the rule marks
# promising on development. Never used for a verdict or to choose a setting.
[cost_grid]
targets = ["B0", "C1"]
add_promising_primaries = true
slippage_points_per_leg = [0.5, 1.0, 2.0]
brokerage_per_order_rs = [0.0, 20.0, 40.0]

# Descriptive hypothetical cases, plan sections 6.5 and 7. Recomputed after the run from legs.csv, on exercised
# bought legs only. Verdicts stay on the zero assumption; any difference is printed beside them.
[stamp_sensitivity]
targets = ["C1", "C2", "C3"]
rate_source = "reference/cost_rates.csv: stamp_duty, option_purchase, by expiry date"
changes_verdict = false

[[stamp_sensitivity.cases]]
id = "A"
basis = "intrinsic_value_x_quantity"

[[stamp_sensitivity.cases]]
id = "B"
basis = "settlement_level_x_quantity"
note = "hypothetical, no legal basis found, not a legal limit"

# Descriptive, plan sections 6.7 and 7. Hypothetical cases, not legal limits.
[notional_sensitivity]
targets = ["B0", "C1", "C2", "C3"]
cases = ["strike_x_quantity", "strike_plus_entry_fill_x_quantity"]
changes_verdict = false

# Descriptive, plan sections 6.6 and 7. The M3-M7 treatment, recomputed from each charge line.
[gst_sensitivity]
targets = ["B0", "C1", "C2", "C3"]
cases = ["ipft_excluded_from_gst_base"]
changes_verdict = false

# After the freeze only. Picked by code; the traced weeks stay in every statistic.
[trade_trace]
period = "development"
pick = "first_in_expiry_order"
cases = ["bought_leg_in_the_money", "no_bought_leg_in_the_money"]
variant = "C1"
