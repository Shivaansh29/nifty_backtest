# Runs the same checks you run locally (see README) on every push and pull request.
name: CI

on:
  push:
  pull_request:

# This workflow only reads the code, so it gets no write access to the repository.
permissions:
  contents: read

jobs:
  python:
    name: Python checks
    # A fixed image, so a GitHub-side OS upgrade cannot change CI silently.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to exact versions so CI can't change underneath us.
      - uses: actions/checkout@v7.0.1

      # Installs uv; uv then installs the exact Python in .python-version (3.12.15), the same
      # build used locally, instead of whatever Python the runner image happens to ship.
      # The uv CLI itself is pinned too (the version used locally). Without it CI gets the
      # newest uv, which can fall outside pyproject.toml's uv_build range (the build backend,
      # a separate package) and then builds the project with a different toolchain.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently
      # resolving different versions than the ones tested locally.
      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      # Node exactly as in frontend/.nvmrc (24.14.1), the version used locally.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json lists and fails if it disagrees with
      # package.json, like `uv sync --locked` for Python.
      - name: Install dependencies exactly as locked
        run: npm ci

      # The TypeScript types come from the API's OpenAPI schema (src/api/openapi.json, which
      # the Python job checks against the live app). Regenerate them and fail on any difference.
      - name: Check generated API types are current
        run: npm run gen:types && git diff --exit-code src/api/schema.d.ts

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
