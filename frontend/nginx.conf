# nginx inside the dashboard image (M8). It serves the built React app and forwards API
# requests to the `api` service on the private compose network. The API publishes no port of
# its own, so this proxy is the only way in, and compose.yaml binds it to 127.0.0.1 only.
# There is no authentication: do not expose this port to a network you do not trust.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/dashboard;
    server_tokens off;

    # Ask Docker's internal DNS for the api container's address at request time (every 10 s
    # at most), so that restarting the API, which can change its address, does not leave
    # nginx forwarding to a stale one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Headers for every response. Cache rules below use `expires`, which sets Cache-Control
    # without overriding these (an add_header inside a location would drop them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The REST API. The API answers a launch (POST /api/runs) only when the run is saved. A
    # full five-year launch takes under two minutes on Linux, but about four and a half on
    # Docker Desktop for macOS, where reading the bind-mounted data through its file sharing
    # is slower (measured for M8). The read timeout leaves headroom over both.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
    }

    # FastAPI's generated documentation and the OpenAPI schema it is built from.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Liveness of nginx itself, for the compose health check. Not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every asset's file name, so an asset never changes under the
    # same name and browsers may keep it for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html is always re-checked, so a rebuilt dashboard is picked up on the next visit.
    # The dashboard routes with #/... URLs, but any other path also falls back to it.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
